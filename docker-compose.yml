# Define environments first
x-environments:
  dev-local: &dev-local-env
    environment:
      NODE_ENV: development
      REACT_APP_API_URL: http://localhost:8888
      SERVER_NAME: localhost
      DNS_RESOLVER: 8.8.8.8
      SSL_CONFIG: ""

  dev-prod: &dev-prod-env
    environment:
      NODE_ENV: development
      REACT_APP_API_URL: http://dronepilotapp.psi.ncsu.edu
      SERVER_NAME: localhost
      DNS_RESOLVER: 152.1.14.14
      SSL_CONFIG: ""

services:
  api-dev:
    extends:
      file: ../drone-image_processing-api/docker-compose.yml
      service: api-dev
    profiles:
      - dev-local
  
  file-server:
    extends:
      file: ../drone-image_processing-api/docker-compose.yml
      service: file-server
    profiles:
      - dev-local
  dev-nginx:
    image: nginx:alpine
    volumes:
      - ./nginx-dev.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "127.0.0.1:8888:80"  # Expose on port 8888
    networks:
      - drone-network
    profiles:
      - dev-local
    depends_on:
      - api-dev
      - file-server
  
  frontend-dev-local:
    image: node:22
    working_dir: /usr/src/app
    volumes:
      - ./:/usr/src/app
    ports:
      - "3000:3000"
    command: npm start
    <<: *dev-local-env
    networks:
      - drone-network
    profiles:
      - dev-local

  frontend-dev-prod:
    image: node:22
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
    ports:
      - "3000:3000"
    command: npm start
    <<: *dev-prod-env
    profiles:
      - dev-prod

networks:
  drone-network:
    name: drone-network
    external: true
